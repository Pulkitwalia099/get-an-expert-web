<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Plan Room · Rebuild the marketplace preview in Swiss Industrial</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #fafaf9;
  --surface: #ffffff;
  --surface-2: #f5f5f4;
  --ink: #1c1917;
  --muted: #78716c;
  --line: #e7e5e4;
  --accent: #4f46e5;
  --approve: #15803d;
  --reject: #b91c1c;
  --edit: #1d4ed8;
  --warn-bg: #fef3c7;
  --warn-ink: #92400e;
  --tier-low: #15803d;
  --tier-medium: #b45309;
  --tier-high: #b91c1c;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --radius: 10px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131312;
    --surface: #1c1c1b;
    --surface-2: #232322;
    --ink: #e8e6e3;
    --muted: #a8a29e;
    --line: #2e2d2b;
    --accent: #818cf8;
    --approve: #4ade80;
    --reject: #f87171;
    --edit: #93c5fd;
    --warn-bg: #3a2e10;
    --warn-ink: #fcd34d;
    --tier-low: #4ade80;
    --tier-medium: #fbbf24;
    --tier-high: #f87171;
  }
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

main {
  max-width: 760px;
  margin: 0 auto;
  padding: 48px 20px 150px;
}

code,
.mono {
  font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  font-size: 0.86em;
}

code {
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 1px 5px;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* ---- Header ---- */

.kicker {
  font-family: ui-monospace, Menlo, monospace;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}

h1 {
  font-size: clamp(22px, 4vw, 30px);
  letter-spacing: -0.02em;
  line-height: 1.2;
  margin: 8px 0 14px;
}

.goal {
  font-size: 17.5px;
  line-height: 1.55;
  max-width: 58ch;
  margin: 0 0 20px;
}

.meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

.chip {
  font-family: ui-monospace, Menlo, monospace;
  font-size: 12px;
  color: var(--muted);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px 10px;
  background: var(--surface);
}

.badge-risk {
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-size: 11px;
}

.badge-risk[data-tier="low"] { color: var(--tier-low); border-color: color-mix(in srgb, var(--tier-low) 40%, var(--line)); }
.badge-risk[data-tier="medium"] { color: var(--tier-medium); border-color: color-mix(in srgb, var(--tier-medium) 40%, var(--line)); }
.badge-risk[data-tier="high"] { color: var(--tier-high); border-color: color-mix(in srgb, var(--tier-high) 40%, var(--line)); }

.meter {
  height: 3px;
  background: var(--line);
  border-radius: 2px;
  margin-top: 22px;
  overflow: hidden;
}

.meter i {
  display: block;
  height: 100%;
  background: var(--accent);
  transform-origin: left;
  transform: scaleX(var(--p, 0));
  transition: transform 250ms var(--ease-out);
}

/* ---- Sections ---- */

section {
  margin-top: 48px;
}

h2 {
  font-size: 12.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: var(--muted);
  margin: 0 0 14px;
  display: flex;
  align-items: baseline;
  gap: 8px;
}

h2 .count {
  font-family: ui-monospace, Menlo, monospace;
  font-weight: 400;
}

.stack {
  display: grid;
  gap: 12px;
}

/* ---- Cards ---- */

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 3px solid var(--line);
  border-radius: var(--radius);
  padding: 16px 18px;
  transition: border-color 180ms var(--ease-out), background-color 180ms var(--ease-out);
  opacity: 0;
  animation: card-in 300ms var(--ease-out) forwards;
  animation-delay: calc(var(--i, 0) * 35ms);
}

@keyframes card-in {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Entrance stagger runs once. After first paint the app is marked settled so
   re-renders triggered by decisions never replay the animation. */
#app.settled .card {
  animation: none;
  opacity: 1;
}

.card[data-state="approve"] {
  border-left-color: var(--approve);
  background: color-mix(in srgb, var(--approve) 4%, var(--surface));
}

.card[data-state="edit"] {
  border-left-color: var(--edit);
  background: color-mix(in srgb, var(--edit) 4%, var(--surface));
}

.card[data-state="reject"] {
  border-left-color: var(--reject);
  background: color-mix(in srgb, var(--reject) 4%, var(--surface));
}

.card-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
}

.task-id {
  font-family: ui-monospace, Menlo, monospace;
  font-size: 12px;
  color: var(--muted);
}

.card h3 {
  font-size: 15.5px;
  font-weight: 600;
  margin: 0;
  flex: 1;
}

.tier {
  font-family: ui-monospace, Menlo, monospace;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.tier[data-tier="low"] { color: var(--tier-low); }
.tier[data-tier="medium"] { color: var(--tier-medium); }
.tier[data-tier="high"] { color: var(--tier-high); }

.notes {
  margin: 10px 0 0;
  color: var(--muted);
  font-size: 14px;
}

.criteria {
  list-style: none;
  margin: 12px 0 0;
  padding: 0;
  display: grid;
  gap: 6px;
}

.criteria li {
  font-size: 13.5px;
  padding-left: 14px;
  position: relative;
}

.criteria li::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0.62em;
  width: 5px;
  height: 5px;
  border-radius: 1px;
  background: var(--line);
}

.criteria li[data-exec="true"]::before {
  background: var(--accent);
}

.runnable {
  font-family: ui-monospace, Menlo, monospace;
  font-size: 10.5px;
  color: var(--accent);
  margin-left: 6px;
  letter-spacing: 0.04em;
}

/* ---- Buttons ---- */

.btn {
  appearance: none;
  font: inherit;
  font-size: 13.5px;
  font-weight: 500;
  color: var(--ink);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 7px 14px;
  cursor: pointer;
  transition: transform 120ms var(--ease-out), background-color 150ms var(--ease-out),
    border-color 150ms var(--ease-out), color 150ms var(--ease-out), opacity 150ms var(--ease-out);
}

.btn:active {
  transform: scale(0.97);
}

@media (hover: hover) and (pointer: fine) {
  .btn:not(:disabled):hover {
    border-color: currentColor;
  }
}

.btn-approve { color: var(--approve); }
.btn-reject { color: var(--reject); }
.btn-edit { color: var(--muted); }

.btn[aria-pressed="true"] {
  border-color: currentColor;
  background: color-mix(in srgb, currentColor 12%, transparent);
}

.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  font-weight: 600;
}

@media (hover: hover) and (pointer: fine) {
  .btn-primary:not(:disabled):hover {
    background: color-mix(in srgb, var(--accent) 88%, #000);
  }
}

.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  transform: none;
}

.btn-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 14px;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted);
}

/* ---- Forms ---- */

textarea,
input[type="text"] {
  width: 100%;
  font: inherit;
  font-size: 14px;
  color: var(--ink);
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 12px;
  resize: vertical;
}

.editor {
  margin-top: 12px;
  display: grid;
  gap: 8px;
}

.hint {
  font-size: 12.5px;
  color: var(--muted);
}

.status-line {
  margin-top: 12px;
  font-size: 13.5px;
  display: flex;
  gap: 8px;
  align-items: baseline;
}

.status-line .what {
  font-weight: 600;
}

.status-line[data-state="approve"] .what { color: var(--approve); }
.status-line[data-state="edit"] .what { color: var(--edit); }
.status-line[data-state="reject"] .what { color: var(--reject); }

.status-line .why {
  color: var(--muted);
  white-space: pre-wrap;
}

/* ---- Radios (tradeoffs, quiz) ---- */

.option {
  display: flex;
  gap: 10px;
  align-items: baseline;
  padding: 9px 10px;
  border-radius: 8px;
  cursor: pointer;
  transition: background-color 150ms var(--ease-out);
}

@media (hover: hover) and (pointer: fine) {
  .option:hover {
    background: var(--surface-2);
  }
}

.option input {
  accent-color: var(--accent);
  margin-top: 4px;
}

.option .cost {
  color: var(--muted);
}

fieldset {
  border: 0;
  margin: 0 0 8px;
  padding: 0;
}

legend {
  font-weight: 600;
  font-size: 14.5px;
  padding: 0;
  margin-bottom: 6px;
}

.quiz-result {
  font-size: 13.5px;
  margin-top: 10px;
}

.quiz-result[data-ok="true"] { color: var(--approve); }
.quiz-result[data-ok="false"] { color: var(--reject); }

/* ---- Diagram ---- */

.diagram-wrap {
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  padding: 14px;
}

.diag-box { fill: var(--surface-2); stroke: var(--line); }
.diag-box.changed { fill: color-mix(in srgb, var(--accent) 7%, var(--surface)); stroke: var(--accent); stroke-width: 1.4; }
.diag-text { fill: var(--ink); font: 12.5px ui-monospace, Menlo, monospace; }
.diag-sub { fill: var(--muted); font: 10.5px ui-monospace, Menlo, monospace; }
.diag-label { fill: var(--muted); font: 600 10.5px -apple-system, system-ui, sans-serif; letter-spacing: 0.09em; }
.diag-arrow { stroke: var(--muted); fill: none; }
.diag-arrowhead { fill: var(--muted); }

/* ---- Lists ---- */

.plain-list {
  margin: 0;
  padding-left: 18px;
  display: grid;
  gap: 6px;
}

details.leftover {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  padding: 10px 16px;
}

details.leftover summary {
  cursor: pointer;
  font-weight: 600;
  font-size: 14px;
}

details.leftover pre {
  white-space: pre-wrap;
  font-size: 12.5px;
  color: var(--muted);
  margin: 10px 0 4px;
}

/* ---- Export bar ---- */

.exportbar {
  position: fixed;
  inset-inline: 0;
  bottom: 0;
  background: color-mix(in srgb, var(--bg) 84%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  padding: 12px 20px calc(12px + env(safe-area-inset-bottom));
}

.exportbar-inner {
  max-width: 760px;
  margin: 0 auto;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.gates {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 12px;
  flex: 1;
  min-width: 220px;
}

.gate {
  font-family: ui-monospace, Menlo, monospace;
  font-size: 12px;
  color: var(--muted);
  transition: color 200ms var(--ease-out);
}

.gate[data-done="true"] {
  color: var(--approve);
}

/* ---- Dialog ---- */

dialog {
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 22px;
  max-width: 680px;
  width: calc(100% - 40px);
  max-height: 80vh;
}

dialog::backdrop {
  background: rgba(0, 0, 0, 0.35);
  backdrop-filter: blur(2px);
}

dialog h3 {
  margin: 0 0 12px;
  font-size: 16px;
}

dialog pre {
  white-space: pre-wrap;
  font-size: 12.5px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 14px;
  max-height: 50vh;
  overflow: auto;
}

.callout-warn {
  background: var(--warn-bg);
  color: var(--warn-ink);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 13px;
  margin-bottom: 12px;
}

footer {
  margin-top: 56px;
  font-family: ui-monospace, Menlo, monospace;
  font-size: 11.5px;
  color: var(--muted);
}

@media (prefers-reduced-motion: reduce) {
  .card {
    animation: none;
    opacity: 1;
  }
  .btn,
  .btn:active {
    transition: none;
    transform: none;
  }
  .meter i {
    transition: none;
  }
}

</style>
</head>

 no `border-radius` other than 0.","GIVEN any element, THE SYSTEM SHALL have no `box-shadow`, no gradient fill,","WHEN a boundary is needed, THE SYSTEM SHALL draw a solid 1px or 2px rule"],"notes":[],"raw":"**T3: Strip the old material system.**"},{"id":"T4","title":"Rebuild the layout on a blueprint grid.","criteria":["WHEN a multi-item group renders, THE SYSTEM SHALL use `display:grid` with","GIVEN a page, THE SYSTEM SHALL alternate between dense monospace data","GIVEN any section boundary, THE SYSTEM SHALL use a full width rule."],"notes":[],"raw":"**T4: Rebuild the layout on a blueprint grid.**"},{"id":"T5","title":"Resolve the single accent conflict.","criteria":["GIVEN hazard red is the only permitted accent, THE SYSTEM SHALL decide in","WHEN a status needs to be distinguished without colour, THE SYSTEM SHALL"],"notes":[],"raw":"**T5: Resolve the single accent conflict.**"},{"id":"T6","title":"Convert the shared components.","criteria":["WHEN a badge, chip, button, input, card, FAQ row or price table renders,","WHEN the honesty badges render, THE SYSTEM SHALL keep the exact strings"],"notes":[],"raw":"**T6: Convert the shared components.**"},{"id":"T7","title":"Decide the emoji question.","criteria":["GIVEN the four how it works cards currently use emoji at the user's"],"notes":[],"raw":"**T7: Decide the emoji question.**"},{"id":"T8","title":"Convert the pages in a fixed order.","criteria":["WHEN the first page is converted, THE SYSTEM SHALL convert `voice.html`","GIVEN approval, THE SYSTEM SHALL then convert `index.html`, then the four"],"notes":[],"raw":"**T8: Convert the pages in a fixed order.**"},{"id":"T9","title":"Absorb the audit findings that survive.","criteria":["GIVEN the redesign sets radius to 0 and section heads to left aligned,","WHEN the conversion is done, THE SYSTEM SHALL still have applied item 01","GIVEN items E2 and E4 were left as the user's call, THE SYSTEM SHALL raise"],"notes":[],"raw":"**T9: Absorb the audit findings that survive.**"},{"id":"T10","title":"Verify before claiming done.","criteria":["WHEN a page is converted, THE SYSTEM SHALL report 0px horizontal overflow","WHEN hazard red is used on the paper ground, THE SYSTEM SHALL report the","WHEN a page is converted, THE SYSTEM SHALL re-shoot desktop and mobile into","GIVEN the sample videos on `ugc.html`, THE SYSTEM SHALL confirm each still"],"notes":[],"raw":"**T10: Verify before claiming done.**"}],"tradeoffs":[{"id":"D1","title":"**Which page gets converted first:**","options":[{"label":"`voice.html` first. Unfinished, no real assets, nothing to break. Slowest route to seeing the language on the work that actually matters.","cost":""},{"label":"`ugc.html` first. The flagship, and it carries the real videos, so it is the honest test of whether the language survives real content. It is also the only finished page, so a bad conversion damages shipped work.","cost":""},{"label":"`index.html` first. The tile grid is where the language will either sing or fall apart, and it is the page a visitor sees first. Six tiles is also the largest single conversion.","cost":""}]},{"id":"D2","title":"**Which face to use for the macro grotesk:**","options":[{"label":"Archivo Black. Free, self hostable today, close to the reference. Slightly narrower than ideal and only one weight.","cost":""},{"label":"Neue Haas Grotesk or Monument Extended. Exactly the reference, costs money, and needs a licence check before it can ship.","cost":""},{"label":"System sans at weight 900. Free and instant, and undersells the language badly enough that the redesign may read as unfinished.","cost":""}]},{"id":"D3","title":"**How much analog degradation to apply:**","options":[{"label":"None. Clean Swiss print only. Safest, and risks reading as merely plain.","cost":""},{"label":"Grain only. One low opacity noise layer over the root. Cheap, subtle, hard to get wrong.","cost":""},{"label":"Full treatment. Halftone imagery, barcodes, crosshairs at grid intersections, registrati <script>
const EARS_START = /^(WHEN|WHILE|WHERE|IF|GIVEN)\b/i;
const SHALL = /\bSHALL\b/;

const RUNNABLE_SUBJECT = /\b(tests?|lint\w*|typecheck\w*|builds?|coverage)\b/i;
const RUNNABLE_VERDICT = /\b(pass(es)?|clean|green|succeed(s|ed)?|0 (errors|failures))\b/i;

function isEars(line) {
  if (typeof line !== 'string') return false;
  return EARS_START.test(line.trim()) || SHALL.test(line);
}

function isExecutable(criterion) {
  if (typeof criterion !== 'string') return false;
  const c = criterion.trim();
  if (c.startsWith('/goal ')) return true;
  return RUNNABLE_SUBJECT.test(c) && RUNNABLE_VERDICT.test(c);
}

function normalizeExecutable(criterion) {
  return criterion
    .trim()
    .replace(/^(WHEN|WHILE|WHERE|IF|GIVEN)\s+[^,]+,\s*/i, '')
    .replace(/^\/goal\s+/, '')
    .replace(/[.;]\s*$/, '')
    .trim();
}

function goalString(criteria) {
  if (!Array.isArray(criteria)) return null;
  const seen = new Set();
  const parts = [];
  for (const c of criteria.filter(isExecutable)) {
    const normalized = normalizeExecutable(c);
    const key = normalized.toLowerCase();
    if (normalized && !seen.has(key)) {
      seen.add(key);
      parts.push(normalized);
    }
  }
  if (parts.length === 0) return null;
  return `/goal ${parts.join(' and ')}`;
}

;
// Pure review-state logic. Runs in two places: imported by Node tests, and
// inlined into the generated artifact (import/export lines are stripped, so
// this file must not depend on the DOM or on Date).


function initialState(model) {
  return {
    v: 1,
    plan: model.hash,
    decisions: {},
    tradeoffs: {},
    unknowns: {},
    quiz: { answers: null, attempts: 0, score: null, passed: false, at: null },
    nonGoalsText: null,
    exportedAt: null,
  };
}

function requireId(collection, id, kind) {
  const found = collection.find((item) => item.id === id);
  if (!found) throw new Error(`Unknown ${kind}: ${id}`);
  return found;
}

function decideTask(model, state, taskId, action, payload = {}, at = null) {
  requireId(model.tasks, taskId, 'task');
  if (action === 'clear') {
    const { [taskId]: _dropped, ...rest } = state.decisions;
    return { ...state, decisions: rest, exportedAt: null };
  }
  if (!['approve', 'edit', 'reject'].includes(action)) {
    throw new Error(`Unknown action: ${action}`);
  }
  const entry = { action, at };
  if (action === 'edit') {
    if (!payload.text || !payload.text.trim()) throw new Error('Edit requires replacement text');
    entry.text = payload.text.trim();
  }
  if (action === 'reject') {
    if (!payload.reason || !payload.reason.trim()) throw new Error('Reject requires a reason');
    entry.reason = payload.reason.trim();
  }
  return { ...state, decisions: { ...state.decisions, [taskId]: entry } };
}

function chooseTradeoff(model, state, tradeoffId, optionIndex, at = null) {
  const tradeoff = requireId(model.tradeoffs, tradeoffId, 'tradeoff');
  if (!Number.isInteger(optionIndex) || optionIndex < 0 || optionIndex >= tradeoff.options.length) {
    throw new Error(`Invalid option for ${tradeoffId}`);
  }
  return { ...state, tradeoffs: { ...state.tradeoffs, [tradeoffId]: { choice: optionIndex, at } } };
}

function resolveUnknown(model, state, unknownId, { status, answer, note } = {}, at = null) {
  requireId(model.unknowns, unknownId, 'unknown');
  if (!['answered', 'waived'].includes(status)) throw new Error(`Unknown status: ${status}`);
  const entry = { status, at };
  if (status === 'answered') {
    if (!answer || !answer.trim()) throw new Error('Answering requires an answer');
    entry.answer = answer.trim();
  } else if (note && note.trim()) {
    entry.note = note.trim();
  }
  return { ...state, unknowns: { ...state.unknowns, [unknownId]: entry } };
}

function submitQuiz(model, state, answers, at = null) {
  const score = model.quiz.reduce((n, q) => n + (answers?.[q.id] === q.answer ? 1 : 0), 0);
  const threshold = Math.min(2, model.quiz.length);
  return {
    ...state,
    quiz: {
      answers: { ...answers },
      attempts: state.quiz.attempts + 1,
      score,
      passed: model.quiz.length > 0 && score >= threshold,
      at,
    },
  };
}

function gateStatus(model, state) {
  const done = (items, record) => items.filter((item) => record[item.id]).length;
  const tasks = { done: done(model.tasks, state.decisions), total: model.tasks.length };
  const tradeoffs = { done: done(model.tradeoffs, state.tradeoffs), total: model.tradeoffs.length };
  const unknowns = { done: done(model.unknowns, state.unknowns), total: model.unknowns.length };
  const quiz = {
    required: Boolean(model.risk.quizRequired && model.quiz.length >= 2),
    questions: model.quiz.length,
    attempts: state.quiz.attempts,
    score: state.quiz.score,
    passed: state.quiz.passed,
  };
  const allDecided =
    tasks.done === tasks.total && tradeoffs.done === tradeoffs.total && unknowns.done === unknowns.total;
  return { tasks, tradeoffs, unknowns, quiz, ready: allDecided && (!quiz.required || quiz.passed) };
}

function approvedTasks(model, state) {
  return model.tasks
    .map((task) => ({ task, decision: state.decisions[task.id] }))
    .filter(({ decision }) => decision && decision.action !== 'reject');
}

function finalNonGoals(model, state) {
  if (state.nonGoalsText === null) return model.nonGoals;
  return state.nonGoalsText.split('\n').map((l) => l.replace(/^[-*]\s*/, '').trim()).filter(Boolean);
}

function twoSentences(text) {
  return text.split(/(?<=[.!?])\s/).slice(0, 2).join(' ');
}

function buildBrief(model, state) {
  const approved = approvedTasks(model, state);
  const criteria = approved.flatMap(({ task, decision }) =>
    decision.action === 'edit' ? decision.text.split('\n') : task.criteria,
  );
  const condition = goalString(criteria);

  const lines = [`# Brief: ${model.title}`, ''];
  lines.push('## Goal', '', twoSentences(model.goal || model.title), '');
  if (model.constraints.length) {
    lines.push('## Constraints', '', ...model.constraints.map((c) => `- ${c}`), '');
  }
  lines.push('## Approved tasks', '');
  for (const { task, decision } of approved) {
    lines.push(`### ${task.id}: ${task.title}`, '');
    if (decision.action === 'edit') {
      lines.push(decision.text, '');
    } else {
      if (task.notes.length) lines.push(...task.notes.map((n) => `${n}`), '');
      if (task.criteria.length) lines.push(...task.criteria.map((c) => `- ${c}`), '');
    }
  }
  const nonGoals = finalNonGoals(model, state);
  if (nonGoals.length) {
    lines.push('## Non-goals', '', ...nonGoals.map((n) => `- ${n}`), '');
  }
  if (condition) {
    lines.push('## Goal condition', '', '```', condition, '```', '');
  }

  const markdown = lines.join('\n');
  const words = markdown.split(/\s+/).filter(Boolean).length;
  return {
    markdown,
    words,
    overPage: words > 450 || lines.length > 70,
    goalString: condition,
  };
}

function buildAnnotations(model, state, now = null) {
  return {
    version: 1,
    tool: 'plan-room',
    plan: { title: model.title, hash: model.hash },
    exportedAt: now,
    decisions: Object.entries(state.decisions).map(([taskId, d]) => ({ taskId, ...d })),
    tradeoffs: Object.entries(state.tradeoffs).map(([id, t]) => {
      const tradeoff = model.tradeoffs.find((x) => x.id === id);
      return { id, title: tradeoff?.title, chosen: tradeoff?.options[t.choice]?.label, index: t.choice, at: t.at };
    }),
    unknowns: Object.entries(state.unknowns).map(([id, u]) => ({
      id,
      question: model.unknowns.find((x) => x.id === id)?.question,
      ...u,
    })),
    quiz: {
      questions: model.quiz.length,
      attempts: state.quiz.attempts,
      score: state.quiz.score,
      passed: state.quiz.passed,
      answers: state.quiz.answers,
    },
    nonGoalsFinal: finalNonGoals(model, state),
  };
}

// in scope as globals once module syntax is stripped. No network, no Date in
// core paths (timestamps enter here, at the interaction boundary).

/* global initialState, decideTask, chooseTradeoff, resolveUnknown, submitQuiz,
   gateStatus, buildBrief, buildAnnotations, isExecutable */

let model = null;
let state = null;
const ui = { editTask: null, rejectTask: null, reopenUnknown: null, editNonGoals: false, quizSel: {} };

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (value === false || value == null) continue;
    if (key === 'class') node.className = value;
    else if (key === 'html') node.innerHTML = value; // build-time SVG only; labels escaped in diagram.js
    else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value === true ? '' : value);
  }
  for (const child of children.flat(Infinity)) {
    if (child == null || child === false) continue;
    node.append(child.nodeType ? child : document.createTextNode(child));
  }
  return node;
}

const INLINE_MD = /(`[^`]+`)|(\*\*[^*]+\*\*)|(\*[^*]+\*)|\[([^\]]+)\]\(([^)]+)\)/g;

function mdInline(text) {
  const frag = document.createDocumentFragment();
  let last = 0;
  for (const m of text.matchAll(INLINE_MD)) {
    if (m.index > last) frag.append(text.slice(last, m.index));
    if (m[1]) frag.append(el('code', {}, m[1].slice(1, -1)));
    else if (m[2]) frag.append(el('strong', {}, m[2].slice(2, -2)));
    else if (m[3]) frag.append(el('em', {}, m[3].slice(1, -1)));
    else if (m[4]) frag.append(m[4], el('span', { class: 'hint' }, ` (${m[5]})`));
    last = m.index + m[0].length;
  }
  if (last < text.length) frag.append(text.slice(last));
  return frag;
}

function storageKey() {
  return `plan-room:${model.hash}`;
}

function loadState() {
  try {
    const raw = localStorage.getItem(storageKey());
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    return parsed && parsed.v === 1 && parsed.plan === model.hash ? parsed : null;
  } catch {
    return null;
  }
}

function setState(next) {
  state = next;
  try {
    localStorage.setItem(storageKey(), JSON.stringify(state));
  } catch {
    /* file:// private mode: review still works, it just won't survive reload */
  }
  render();
}

function act(fn) {
  try {
    setState(fn());
  } catch (err) {
    console.error(err);
    alert(err.message);
  }
}

/* ---- Header ---- */

function headerEl() {
  const gate = gateStatus(model, state);
  const total = gate.tasks.total + gate.tradeoffs.total + gate.unknowns.total;
  const done = gate.tasks.done + gate.tradeoffs.done + gate.unknowns.done;
  const chips = [
    el('span', { class: 'chip badge-risk', 'data-tier': model.risk.overall }, `${model.risk.overall} risk`),
    el('span', { class: 'chip' }, `~${model.risk.reviewMinutes} min review`),
    model.risk.files.length ? el('span', { class: 'chip' }, `${model.risk.files.length} files`) : null,
    model.risk.systems.length
      ? el('span', { class: 'chip', title: model.risk.systems.join(', ') },
          `${model.risk.systems.length} systems: ${model.risk.systems.slice(0, 3).join(', ')}${model.risk.systems.length > 3 ? '…' : ''}`)
      : null,
    gate.quiz.required ? el('span', { class: 'chip' }, 'quiz gated') : null,
    el('button', {
      class: 'btn btn-ghost',
      onclick: () => {
        if (confirm('Clear every decision in this review?')) {
          try { localStorage.removeItem(storageKey()); } catch { /* ignore */ }
          setState(initialState(model));
        }
      },
    }, 'Reset'),
  ];
  const meter = el('div', { class: 'meter', role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': String(total), 'aria-valuenow': String(done) },
    el('i', { style: `--p:${total ? done / total : 0}` }));
  return el('header', {},
    el('div', { class: 'kicker' }, 'Plan Room'),
    el('h1', {}, model.title),
    el('p', { class: 'goal' }, mdInline(model.goal || '')),
    el('div', { class: 'meta' }, chips),
    meter,
  );
}

/* ---- Tasks ---- */

function statusLine(decision) {
  const words = { approve: 'Approved', edit: 'Edited', reject: 'Rejected' };
  const why = decision.action === 'reject' ? decision.reason : decision.action === 'edit' ? decision.text : '';
  return el('div', { class: 'status-line', 'data-state': decision.action },
    el('span', { class: 'what' }, words[decision.action]),
    why ? el('span', { class: 'why' }, why) : null,
  );
}

function taskEditor(task, decision) {
  const initial = decision?.text || [task.title, ...task.notes, ...task.criteria].join('\n');
  const textarea = el('textarea', { rows: '5' });
  textarea.value = initial;
  const save = el('button', {
    class: 'btn btn-edit',
    onclick: () => {
      ui.editTask = null;
      act(() => decideTask(model, state, task.id, 'edit', { text: textarea.value }, new Date().toISOString()));
    },
  }, 'Save edit');
  const sync = () => { if (textarea.value.trim()) save.removeAttribute('disabled'); else save.setAttribute('disabled', ''); };
  textarea.addEventListener('input', sync);
  sync();
  return el('div', { class: 'editor' },
    textarea,
    el('div', { class: 'btn-row', style: 'margin-top:0' },
      save,
      el('button', { class: 'btn btn-ghost', onclick: () => { ui.editTask = null; render(); } }, 'Cancel'),
    ),
  );
}

function rejectEditor(task) {
  const textarea = el('textarea', { rows: '3', placeholder: 'Why is this task wrong or out of scope?' });
  const save = el('button', {
    class: 'btn btn-reject',
    disabled: true,
    onclick: () => {
      ui.rejectTask = null;
      act(() => decideTask(model, state, task.id, 'reject', { reason: textarea.value }, new Date().toISOString()));
    },
  }, 'Reject task');
  textarea.addEventListener('input', () => {
    if (textarea.value.trim()) save.removeAttribute('disabled'); else save.setAttribute('disabled', '');
  });
  return el('div', { class: 'editor' },
    textarea,
    el('div', { class: 'hint' }, 'A reason is required — rejections feed annotations.json.'),
    el('div', { class: 'btn-row', style: 'margin-top:0' },
      save,
      el('button', { class: 'btn btn-ghost', onclick: () => { ui.rejectTask = null; render(); } }, 'Cancel'),
    ),
  );
}

function decisionButton(task, decision, action, label, cls) {
  return el('button', {
    class: `btn ${cls}`,
    'aria-pressed': decision?.action === action ? 'true' : 'false',
    onclick: () => {
      ui.editTask = null;
      ui.rejectTask = null;
      if (decision?.action === action) {
        act(() => decideTask(model, state, task.id, 'clear', {}, null));
      } else if (action === 'edit') {
        ui.editTask = task.id;
        render();
      } else if (action === 'reject') {
        ui.rejectTask = task.id;
        render();
      } else {
        act(() => decideTask(model, state, task.id, 'approve', {}, new Date().toISOString()));
      }
    },
  }, label);
}

function taskCard(task, index) {
  const decision = state.decisions[task.id];
  const tier = model.risk.perTask[task.id];
  return el('article', { class: 'card', 'data-state': decision?.action, style: `--i:${Math.min(index, 10)}` },
    el('div', { class: 'card-head' },
      el('span', { class: 'task-id' }, task.id),
      el('h3', {}, mdInline(task.title)),
      el('span', { class: 'tier', 'data-tier': tier }, tier),
    ),
    task.notes.length ? el('div', { class: 'notes' }, task.notes.map((n) => el('p', { style: 'margin:4px 0' }, mdInline(n)))) : null,
    task.criteria.length
      ? el('ul', { class: 'criteria' }, task.criteria.map((c) =>
          el('li', { 'data-exec': String(isExecutable(c)) },
            mdInline(c),
            isExecutable(c) ? el('span', { class: 'runnable' }, 'runnable') : null,
          )))
      : null,
    decision ? statusLine(decision) : null,
    el('div', { class: 'btn-row' },
      decisionButton(task, decision, 'approve', 'Approve', 'btn-approve'),
      decisionButton(task, decision, 'edit', 'Edit', 'btn-edit'),
      decisionButton(task, decision, 'reject', 'Reject', 'btn-reject'),
    ),
    ui.editTask === task.id ? taskEditor(task, decision) : null,
    ui.rejectTask === task.id ? rejectEditor(task) : null,
  );
}

function tasksSection() {
  const gate = gateStatus(model, state);
  return el('section', {},
    el('h2', {}, 'Task decisions', el('span', { class: 'count' }, `${gate.tasks.done}/${gate.tasks.total}`)),
    el('div', { class: 'stack' }, model.tasks.map(taskCard)),
  );
}

/* ---- Tradeoffs ---- */

function tradeoffCard(tradeoff, index) {
  const chosen = state.tradeoffs[tradeoff.id];
  return el('article', { class: 'card', 'data-state': chosen ? 'approve' : null, style: `--i:${Math.min(index, 10)}` },
    el('h3', { style: 'font-size:15.5px;margin:0 0 8px' }, mdInline(tradeoff.title)),
    tradeoff.options.map((option, i) =>
      el('label', { class: 'option' },
        el('input', {
          type: 'radio',
          name: `tradeoff-${tradeoff.id}`,
          checked: chosen?.choice === i,
          onchange: () => act(() => chooseTradeoff(model, state, tradeoff.id, i, new Date().toISOString())),
        }),
        el('span', {}, el('strong', {}, option.label), option.cost ? el('span', { class: 'cost' }, ` — ${option.cost}`) : null),
      )),
  );
}

function tradeoffsSection() {
  if (!model.tradeoffs.length) return null;
  const gate = gateStatus(model, state);
  return el('section', {},
    el('h2', {}, 'Tradeoffs — pick one each', el('span', { class: 'count' }, `${gate.tradeoffs.done}/${gate.tradeoffs.total}`)),
    el('div', { class: 'stack' }, model.tradeoffs.map(tradeoffCard)),
  );
}

/* ---- Unknowns ---- */

function unknownCard(unknown, index) {
  const resolved = state.unknowns[unknown.id];
  const open = !resolved || ui.reopenUnknown === unknown.id;
  const children = [el('h3', { style: 'font-size:14.5px;margin:0' }, mdInline(unknown.question))];

  if (resolved && !open) {
    children.push(el('div', { class: 'status-line', 'data-state': resolved.status === 'answered' ? 'approve' : 'edit' },
      el('span', { class: 'what' }, resolved.status === 'answered' ? 'Answered' : 'Waived'),
      el('span', { class: 'why' }, resolved.answer || resolved.note || ''),
    ));
    children.push(el('div', { class: 'btn-row' },
      el('button', { class: 'btn btn-ghost', onclick: () => { ui.reopenUnknown = unknown.id; render(); } }, 'Change'),
    ));
  } else {
    const textarea = el('textarea', { rows: '2', placeholder: 'Answer, or a note on why this can wait' });
    if (resolved) textarea.value = resolved.answer || resolved.note || '';
    const answerBtn = el('button', {
      class: 'btn btn-approve',
      disabled: !textarea.value.trim(),
      onclick: () => {
        ui.reopenUnknown = null;
        act(() => resolveUnknown(model, state, unknown.id, { status: 'answered', answer: textarea.value }, new Date().toISOString()));
      },
    }, 'Save answer');
    textarea.addEventListener('input', () => {
      if (textarea.value.trim()) answerBtn.removeAttribute('disabled'); else answerBtn.setAttribute('disabled', '');
    });
    children.push(el('div', { class: 'editor' },
      textarea,
      el('div', { class: 'btn-row', style: 'margin-top:0' },
        answerBtn,
        el('button', {
          class: 'btn btn-edit',
          onclick: () => {
            ui.reopenUnknown = null;
            act(() => resolveUnknown(model, state, unknown.id, { status: 'waived', note: textarea.value }, new Date().toISOString()));
          },
        }, 'Waive — accept the risk'),
      ),
    ));
  }
  return el('article', {
    class: 'card',
    'data-state': resolved ? (resolved.status === 'answered' ? 'approve' : 'edit') : null,
    style: `--i:${Math.min(index, 10)}`,
  }, children);
}

function unknownsSection() {
  if (!model.unknowns.length) return null;
  const gate = gateStatus(model, state);
  return el('section', {},
    el('h2', {}, 'Unknowns — answer or waive', el('span', { class: 'count' }, `${gate.unknowns.done}/${gate.unknowns.total}`)),
    el('div', { class: 'stack' }, model.unknowns.map(unknownCard)),
  );
}

/* ---- Quiz ---- */

function quizSection() {
  const gate = gateStatus(model, state);
  if (!gate.quiz.required) return null;
  if (state.quiz.passed) {
    return el('section', {},
      el('h2', {}, 'Comprehension check'),
      el('p', { class: 'quiz-result', 'data-ok': 'true' },
        `Passed ${state.quiz.score}/${model.quiz.length}` + (state.quiz.attempts > 1 ? ` (attempt ${state.quiz.attempts})` : '')),
    );
  }
  const submit = el('button', { class: 'btn btn-primary', disabled: true, onclick: () => {
    const answers = { ...ui.quizSel };
    ui.quizSel = {};
    act(() => submitQuiz(model, state, answers, new Date().toISOString()));
  } }, 'Check answers');
  const syncSubmit = () => {
    if (Object.keys(ui.quizSel).length === model.quiz.length) submit.removeAttribute('disabled');
  };
  const fields = model.quiz.map((q) =>
    el('fieldset', {},
      el('legend', {}, q.question),
      q.options.map((option, i) =>
        el('label', { class: 'option' },
          el('input', {
            type: 'radio',
            name: `quiz-${q.id}`,
            checked: ui.quizSel[q.id] === i,
            onchange: () => { ui.quizSel[q.id] = i; syncSubmit(); },
          }),
          el('span', {}, option),
        )),
    ));
  return el('section', {},
    el('h2', {}, 'Comprehension check — 2 of 3 unlocks export'),
    el('div', { class: 'card' },
      fields,
      state.quiz.attempts > 0
        ? el('p', { class: 'quiz-result', 'data-ok': 'false' },
            `Scored ${state.quiz.score}/${model.quiz.length}. Skim the plan again and retry.`)
        : null,
      el('div', { class: 'btn-row' }, submit),
    ),
  );
}

/* ---- Non-goals, milestones, risks, leftovers ---- */

function currentNonGoals() {
  if (state.nonGoalsText === null) return model.nonGoals;
  return state.nonGoalsText.split('\n').map((l) => l.replace(/^[-*]\s*/, '').trim()).filter(Boolean);
}

function nonGoalsSection() {
  const items = currentNonGoals();
  if (!items.length && !ui.editNonGoals) return null;
  const body = ui.editNonGoals
    ? (() => {
        const textarea = el('textarea', { rows: '4' });
        textarea.value = items.join('\n');
        return el('div', { class: 'editor' },
          textarea,
          el('div', { class: 'hint' }, 'One non-goal per line. Exported with the brief.'),
          el('div', { class: 'btn-row', style: 'margin-top:0' },
            el('button', { class: 'btn btn-edit', onclick: () => { ui.editNonGoals = false; setState({ ...state, nonGoalsText: textarea.value }); } }, 'Save'),
            el('button', { class: 'btn btn-ghost', onclick: () => { ui.editNonGoals = false; render(); } }, 'Cancel'),
          ),
        );
      })()
    : el('ul', { class: 'plain-list' }, items.map((n) => el('li', {}, mdInline(n))));
  return el('section', {},
    el('h2', {}, 'Non-goals — the scope fence',
      ui.editNonGoals ? null : el('button', { class: 'btn btn-ghost', style: 'margin-left:auto', onclick: () => { ui.editNonGoals = true; render(); } }, 'Edit')),
    el('div', { class: 'card' }, body),
  );
}

function listSection(title, items) {
  if (!items.length) return null;
  return el('section', {},
    el('h2', {}, title),
    el('div', { class: 'card' }, el('ul', { class: 'plain-list' }, items.map((i) => el('li', {}, mdInline(i))))),
  );
}

function diagramSection() {
  if (!model.diagram) return null;
  return el('section', {},
    el('h2', {}, 'Blast radius'),
    el('div', { class: 'diagram-wrap', html: model.diagram }),
  );
}

function leftoversSection() {
  if (!model.leftovers.length) return null;
  return el('section', {},
    el('h2', {}, 'Also in the plan (unparsed)'),
    el('div', { class: 'stack' }, model.leftovers.map((s) =>
      el('details', { class: 'leftover' }, el('summary', {}, s.heading), el('pre', {}, s.body)))),
  );
}

/* ---- Export ---- */

function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = el('a', { href: url, download: name });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function copyText(text, button) {
  const done = () => {
    const original = button.textContent;
    button.textContent = 'Copied';
    setTimeout(() => { button.textContent = original; }, 1300);
  };
  if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => window.prompt('Copy the /goal string:', text));
  } else {
    window.prompt('Copy the /goal string:', text);
  }
}

function briefDialog() {
  const brief = buildBrief(model, state);
  const dialog = el('dialog', {},
    el('h3', {}, 'Brief preview'),
    brief.overPage
      ? el('div', { class: 'callout-warn' },
          `${brief.words} words — longer than a page. Over-specifying is micromanaging; consider trimming before export.`)
      : null,
    el('pre', {}, brief.markdown),
    el('div', { class: 'btn-row' },
      el('button', { class: 'btn', onclick: () => dialog.close() }, 'Close'),
    ),
  );
  dialog.addEventListener('close', () => dialog.remove());
  document.body.append(dialog);
  dialog.showModal();
}

function gateChip(label, done, extra) {
  return el('span', { class: 'gate', 'data-done': String(done) }, `${done ? '✓' : '○'} ${label}${extra || ''}`);
}

function exportBar() {
  const gate = gateStatus(model, state);
  const brief = buildBrief(model, state);
  const lockHint = gate.ready ? null : 'Locked until every task, tradeoff, and unknown is decided' + (gate.quiz.required ? ' and the quiz is passed' : '');
  const chips = [
    gateChip(`tasks ${gate.tasks.done}/${gate.tasks.total}`, gate.tasks.done === gate.tasks.total),
    gate.tradeoffs.total ? gateChip(`tradeoffs ${gate.tradeoffs.done}/${gate.tradeoffs.total}`, gate.tradeoffs.done === gate.tradeoffs.total) : null,
    gate.unknowns.total ? gateChip(`unknowns ${gate.unknowns.done}/${gate.unknowns.total}`, gate.unknowns.done === gate.unknowns.total) : null,
    gate.quiz.required ? gateChip(`quiz${gate.quiz.passed ? ` ${gate.quiz.score}/${gate.quiz.questions}` : ''}`, gate.quiz.passed) : null,
  ];
  const copyBtn = brief.goalString
    ? el('button', {
        class: 'btn',
        disabled: !gate.ready,
        title: lockHint,
        onclick: (e) => copyText(brief.goalString, e.currentTarget),
      }, 'Copy /goal')
    : null;
  return el('div', { class: 'exportbar' },
    el('div', { class: 'exportbar-inner' },
      el('div', { class: 'gates', 'aria-live': 'polite' }, chips),
      el('button', { class: 'btn btn-ghost', onclick: briefDialog }, 'Preview'),
      copyBtn,
      el('button', {
        class: 'btn',
        disabled: !gate.ready,
        title: lockHint,
        onclick: () => {
          const now = new Date().toISOString();
          download('annotations.json', JSON.stringify(buildAnnotations(model, state, now), null, 2), 'application/json');
        },
      }, 'annotations.json'),
      el('button', {
        class: 'btn btn-primary',
        disabled: !gate.ready,
        title: lockHint,
        onclick: () => {
          const now = new Date().toISOString();
          download('brief.md', buildBrief(model, state).markdown, 'text/markdown');
          setState({ ...state, exportedAt: now });
        },
      }, 'Export brief.md'),
    ),
  );
}

function footerEl() {
  return el('footer', {},
    `Generated ${model.generatedAt} · seed ${model.seed} · plan ${model.hash} · self-contained, no network`);
}

/* ---- Boot ---- */

function render() {
  const app = document.getElementById('app');
  app.replaceChildren(
    ...[
      headerEl(),
      diagramSection(),
      tasksSection(),
      tradeoffsSection(),
      unknownsSection(),
      quizSection(),
      nonGoalsSection(),
      listSection('Milestones', model.milestones),
      listSection('Stated risks', model.risks),
      leftoversSection(),
      footerEl(),
      exportBar(),
    ].filter(Boolean),
  );
}

function boot() {
  model = JSON.parse(document.getElementById('plan-data').textContent);
  state = loadState() || initialState(model);
  document.title = `Plan Room · ${model.title}`;
  render();
  setTimeout(() => document.getElementById('app').classList.add('settled'), 800);
}

;boot();
</script>
</body>
</html>

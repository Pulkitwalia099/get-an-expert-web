<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- midsesh primary mark: "the splat". Five ink spokes, one terracotta spoke
       raised and detached: a hand up. The detached spoke IS the identity;
       never close the gap or recolor it to match. -->
  <g stroke="#211E1A" stroke-width="9" stroke-linecap="round">
    <line x1="32" y1="32" x2="32"   y2="11"/>
    <line x1="32" y1="32" x2="13.8" y2="21.5"/>
    <line x1="32" y1="32" x2="13.8" y2="42.5"/>
    <line x1="32" y1="32" x2="32"   y2="53"/>
    <line x1="32" y1="32" x2="50.2" y2="42.5"/>
  </g>
  <line x1="39.5" y1="27.7" x2="53.9" y2="19.4" stroke="#C4593C" stroke-width="9" stroke-linecap="round"/>
</svg>

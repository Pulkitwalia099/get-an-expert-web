<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- "The caret": ink bar is the session cursor, terracotta bar is a person
       leaning into the line. Reserved for the loading state: blink the ink bar
       while a search runs, land the terracotta bar when the expert does. -->
  <line x1="24" y1="13" x2="24" y2="51" stroke="#211E1A" stroke-width="9.5" stroke-linecap="round"/>
  <line x1="38.5" y1="19" x2="44" y2="50.5" stroke="#C4593C" stroke-width="9.5" stroke-linecap="round"/>
</svg>
